<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>코존 · 상세페이지 제작기</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>" />
  <style>
    html, body { margin: 0; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #app { border: 0; width: 100%; height: 100%; display: block; }
    #fallback { display: none; padding: 32px; line-height: 1.6; }
    #fallback.show { display: block; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <!-- 메인 UI 는 code/public/index.html 을 iframe 으로 임베드 -->
  <iframe id="app" src="./code/public/index.html" allow="clipboard-read; clipboard-write"></iframe>
  <noscript>
    <div id="fallback" class="show">
      <h2>코존 상세페이지 제작기</h2>
      <p>JavaScript 가 차단되어 있어 직접 진입해 주세요:</p>
      <p><a href="./code/public/index.html">./code/public/index.html</a></p>
    </div>
  </noscript>
</body>
</html>
